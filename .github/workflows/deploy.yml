name: Test & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect static
        env:
          DJANGO_DEBUG: "True"
          DATABASE_URL: "sqlite:///:memory:"
          DJANGO_SETTINGS_MODULE: "config.settings"
          SECRET_KEY: "ci-test-secret-key-not-real"
        run: python manage.py collectstatic --noinput
      - name: Run tests
        env:
          DJANGO_DEBUG: "True"
          DATABASE_URL: "sqlite:///:memory:"
          DJANGO_SETTINGS_MODULE: "config.settings"
          SECRET_KEY: "ci-test-secret-key-not-real"
        run: python manage.py test --verbosity=1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -s -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            -d '{"repo":"cjbwebdev"}' || echo "Webhook unavailable — deploy manually"
